name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Check JavaScript
        run: node --check app/static/app.js

      - name: Validate Compose file
        run: docker compose config

      - name: Build container
        run: docker build -t pvp-reward:ci .

      - name: Smoke test container
        run: |
          docker run -d --name pvp-reward-ci -p 18000:8000 -p 18080:6080 pvp-reward:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/healthz \
              && curl --fail --silent http://127.0.0.1:18080/vnc.html; then
              exit 0
            fi
            sleep 2
          done
          docker logs pvp-reward-ci
          exit 1

      - name: Container logs
        if: failure()
        run: docker logs pvp-reward-ci || true

