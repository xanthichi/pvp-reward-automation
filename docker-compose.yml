name: pvp-reward

services:
  pvp-reward:
    build:
      context: .
      dockerfile: Dockerfile
    image: pvp-reward:local
    restart: unless-stopped
    init: true
    ports:
      - "${PVP_BIND:-0.0.0.0}:${PVP_PORT:-8675}:8000"
    environment:
      PVP_DATA_DIR: /app/data
      PVP_HEADLESS: "1"
      TZ: Asia/Shanghai
      TMPDIR: /tmp/pvp-reward
    volumes:
      - pvp_reward_data:/app/data
    tmpfs:
      - /tmp/pvp-reward:size=1073741824,mode=1777
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pvp_reward_data:
    name: pvp-reward-data


